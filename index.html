<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#02070d" />
  <title>STARK // Cyber Command Center</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/hud.css" />
  <link rel="stylesheet" href="./styles/panels.css" />
  <link rel="stylesheet" href="./styles/animations.css" />
  <link rel="stylesheet" href="./styles/responsive.css" />
</head>
<body>
  <main id="app" class="app-shell" aria-label="STARK Cyber Command Center">
    <video id="webcam" class="webcam-feed" autoplay muted playsinline></video>
    <canvas id="hand-layer" class="hand-layer" aria-hidden="true"></canvas>
    <div class="camera-shade" aria-hidden="true"></div>
    <div class="world-grid" aria-hidden="true"></div>
    <div class="scanline" aria-hidden="true"></div>
    <section id="hud-root" class="hud-root"></section>
    <div id="gesture-cursor" class="gesture-cursor" aria-hidden="true">
      <span class="gesture-cursor__core"></span>
      <span class="gesture-cursor__label">TRACKING</span>
    </div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <section id="boot-screen" class="boot-screen">
      <div class="boot-card">
        <div class="boot-orbit" aria-hidden="true"><i></i><i></i><i></i></div>
        <p class="eyebrow">STARK // LOCAL CYBER LAB</p>
        <h1>Cyber Command Center</h1>
        <p>Webcam, hand tracking, holographic panels, real telemetry snapshots and safe simulated security data.</p>
        <button id="boot-button" class="primary-action" type="button">INITIALIZE HUD</button>
        <small>Camera processing stays in this browser session. External libraries are loaded from CDNs.</small>
      </div>
    </section>
  </main>
  <noscript>Este laboratório precisa de JavaScript habilitado.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
